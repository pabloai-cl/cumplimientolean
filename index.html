<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulatory Data Products | The New Standard for Mining Operations</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* DESIGN SYSTEM & VARIABLES */
        :root {
            --bg-main: #030712;
            --bg-surface: #0b1329;
            --bg-card: #111c44;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --secondary: #6366f1;
            --secondary-glow: rgba(99, 102, 241, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --error: #f87171;
            --success: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* NAVIGATION BAR */
        nav {
            border-b: 1px solid var(--border);
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-left: 32px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* HERO SECTION (FLETCH FRAMEWORK POV) */
        .hero {
            padding: 180px 0 80px 0;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, rgba(3,7,18,0) 70%);
            z-index: -1;
        }

        .badge {
            background: rgba(56, 189, 248, 0.06);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
            color: #ffffff;
        }

        h1 span {
            background: linear-gradient(90deg, var(--primary), #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lead {
            font-size: 20px;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto 48px auto;
            font-weight: 500;
        }

        /* MECANISMO ÚNICO: GUÍA MICHELIN */
        .michelin-box {
            background: linear-gradient(135deg, var(--bg-surface) 0%, rgba(11,19,41,0.6) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            margin-bottom: 96px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .michelin-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .michelin-grid { grid-template-columns: 2.5fr 1fr; }
        }

        .michelin-content h2 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .michelin-content p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.7;
        }

        .michelin-metric {
            background: rgba(99, 102, 241, 0.04);
            border: 1px dashed rgba(99, 102, 241, 0.25);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }

        .michelin-metric .value {
            font-size: 48px;
            font-weight: 800;
            color: #a5b4fc;
            line-height: 1;
            margin-bottom: 8px;
        }

        .michelin-metric .label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TRANSICIÓN DE DOLOR (ANTES VS DESPUÉS) */
        .section-header {
            text-align: center;
            margin-bottom: 56px;
        }

        .section-header h2 {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .vs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            margin-bottom: 96px;
        }

        @media (min-width: 768px) {
            .vs-grid { grid-template-columns: 1fr 1fr; }
        }

        .vs-card {
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background-color: rgba(255,255,255,0.01);
        }

        .vs-card.old { border-color: rgba(248, 113, 113, 0.15); background: linear-gradient(180deg, rgba(248,113,113,0.01) 0%, rgba(3,7,18,0) 100%); }
        .vs-card.new { border-color: rgba(74, 222, 128, 0.15); background: linear-gradient(180deg, rgba(74,222,128,0.01) 0%, rgba(3,7,18,0) 100%); }

        .vs-card h4 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .vs-card.old h4 { color: var(--error); }
        .vs-card.new h4 { color: var(--success); }

        .vs-list {
            list-style: none;
        }

        .vs-list li {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }

        .vs-list li::before {
            margin-right: 12px;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }

        .vs-card.old .vs-list li::before { content: "✕"; color: var(--error); }
        .vs-card.new .vs-list li::before { content: "✓"; color: var(--success); }

        /* PRODUCT-PRODUCT MATCHING (OFERTAS) */
        .offers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            margin-bottom: 96px;
        }

        @media (min-width: 768px) {
            .offers-grid { grid-template-columns: 1fr 1fr; }
        }

        .offer-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .offer-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .offer-card.premium:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .offer-tag {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            display: inline-block;
        }

        .offer-tag.diy { color: var(--primary); }
        .offer-tag.dfy { color: var(--secondary); }

        .offer-card h3 {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .offer-card p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 32px;
        }

        .specs-list {
            list-style: none;
            border-top: 1px solid var(--border);
            padding-top: 32px;
            margin-bottom: 40px;
        }

        .specs-list li {
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }

        .specs-list li::before {
            content: "→";
            color: var(--primary);
            margin-right: 12px;
            font-weight: bold;
        }
